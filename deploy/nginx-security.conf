# Nginx site configuration for Security Department Suite (Hardened Production)
# Domains: security.shajjadkhan.com, security.tawreedflow.com
# Upstream: 127.0.0.1:8001 (Isolated Gunicorn daemon)

server {
    listen 443 ssl;
    server_name security.shajjadkhan.com security.tawreedflow.com;
    client_max_body_size 25M;
    server_tokens off;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/security.shajjadkhan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/security.shajjadkhan.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Defense-in-depth HTTP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Static assets with caching
    location /static/ {
        alias /home/shajjad/security_dept/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media uploads (cargo passes, visitor photos, lost & found)
    location /media/ {
        alias /home/shajjad/security_dept/media/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, max-age=3600";
    }

    # PWA Service Worker & Manifest
    location = /sw.js {
        alias /home/shajjad/security_dept/staticfiles/sw.js;
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        alias /home/shajjad/security_dept/staticfiles/manifest.json;
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy to Security Suite Gunicorn daemon on 127.0.0.1:8001
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTP to HTTPS Automated Redirect
server {
    listen 80;
    server_name security.shajjadkhan.com security.tawreedflow.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
