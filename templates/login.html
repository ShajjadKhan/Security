{% extends 'base.html' %}
{% block title %}Security Terminal Login • Security Dept{% endblock %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-10">
    <div class="w-full max-w-md bg-white dark:bg-navy-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl p-8">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-900/30 text-3xl mx-auto mb-4">
                🛡️
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">Security Officer Access</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Please authenticate with your duty badge credentials.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Badge ID / Username</label>
                <div class="relative">
                    <input type="text" name="username" required autofocus placeholder="e.g. guard1 or secadmin" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <span class="absolute left-3.5 top-3 text-slate-400">👤</span>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">Security Passcode</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <span class="absolute left-3.5 top-3 text-slate-400">🔑</span>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-md shadow-emerald-900/20 transition transform active:scale-[0.99]">
                    Verify Duty Credentials →
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center text-xs text-slate-400">
            <p>Demo Security Accounts: <code class="font-bold text-emerald-600 dark:text-emerald-400">secadmin</code> / <code class="font-bold text-emerald-600 dark:text-emerald-400">guard1</code> (Pass: <code class="font-bold">12345678</code>)</p>
        </div>
    </div>
</div>
{% endblock %}
